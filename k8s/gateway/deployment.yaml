apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoguard-gateway
  namespace: cosmo
  labels:
    app: cryptoguard-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptoguard-gateway
  template:
    metadata:
      labels:
        app: cryptoguard-gateway
        component: gateway
    spec:
      containers:
        - name: gateway
          image: cryptoguard-gateway:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CG_NEBIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cosmo-secrets
                  key: nebius-api-key
                  optional: true
            - name: CG_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cosmo-config
                  key: redis-url
            - name: CG_LOG_LEVEL
              value: "INFO"
            - name: CG_RATE_LIMIT_RPM
              value: "60"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
